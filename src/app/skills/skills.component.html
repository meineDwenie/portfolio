<section id="skills" class="skills-parent">
  <h3>
    {{ "SKILLS.DISCOVER_MY" | translate }}
    <!-- <span>{{ activeTab === "hard" ? "HARD" : "SOFT" }}</span> -->
    <span>{{ "SKILLS.SKILLS" | translate }}</span>
  </h3>

  <div class="skills-columns">
    <!-- LEFT COLUMN -->
    <div class="skills-left">
      <h4>{{ "SKILLS.WHY_HIRE_ME" | translate }}</h4>

      <p>{{ "SKILLS.DESCRIPTION" | translate }}</p>

      <div class="skills-buttons">
        <button
          (click)="switchTab('hard')"
          [class.active]="activeTab === 'hard'"
        >
          {{ "SKILLS.HARD_SKILLS" | translate }}
        </button>
        <!-- <button
          (click)="switchTab('soft')"
          [class.active]="activeTab === 'soft'"
        >
          Soft Skills
        </button> -->
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="skills-right">
      <!-- Hard Skills Cards -->
      <div *ngIf="activeTab === 'hard'" class="skills-container">
        <div class="skills-card" *ngFor="let skill of hardSkills">
          <div class="skills-card-inner">
            <div class="skills-card-front">
              <img [src]="skill.icon" [alt]="skill.name" />
            </div>
            <div class="skills-card-back">
              <h5>{{ skill.name }}</h5>
              <div class="progress-bar">
                <div class="progress-fill" [style.width.%]="skill.level"></div>
              </div>
              <p class="percentage">{{ skill.level }}%</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Soft Skills List -->
      <!-- <ul *ngIf="activeTab === 'soft'" class="soft-skills-list">
        <li *ngFor="let soft of softSkills">{{ soft }}</li>
      </ul> -->
    </div>
  </div>
</section>
